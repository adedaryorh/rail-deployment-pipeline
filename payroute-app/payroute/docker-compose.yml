version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payroute_db
    environment:
      POSTGRES_USER: ${DB_USER:-payroute}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payroute_secret}
      POSTGRES_DB: ${DB_NAME:-payroute}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payroute}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payroute_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-payroute}
      DB_PASSWORD: ${DB_PASSWORD:-payroute_secret}
      DB_NAME: ${DB_NAME:-payroute}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-webhook_secret_placeholder}
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payroute_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
